name: Hent billeder fra det gamle site

# Henter filerne i tools/old-site-assets.txt og committer dem. Startes manuelt (gh workflow run).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent filer
        run: |
          grep -v '^#' tools/old-site-assets.txt | while read -r url path; do
            [ -z "$url" ] && continue
            [ -f "$path" ] && { echo "findes: $path"; continue; }
            mkdir -p "$(dirname "$path")"
            curl -fsSL -A "Mozilla/5.0" -o "$path" "$url" && echo "hentet: $path"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Billeder hentet fra det gamle site"; git push; }
