name: Hent alle medier fra det gamle site (artefakt)

# Henter alle filer i tools/old-site-media.txt og lægger dem som et artefakt (ikke i repoet),
# så de kan bearbejdes lokalt til temaets assets. Startes manuelt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hent filer
        run: |
          mkdir -p media
          while read -r url; do
            [ -z "$url" ] && continue
            path="media/${url#https://simplyguiding.dk/wp-content/uploads/}"
            mkdir -p "$(dirname "$path")"
            curl -fsSL -A "Mozilla/5.0" -o "$path" "$url" || echo "fejl: $url"
          done < tools/old-site-media.txt
          du -sh media
      # Artefakter kan ikke hentes herfra, så filerne lægges på en separat gren (ikke main, så de ikke udrulles)
      - name: Læg på grenen old-media
        run: |
          cd media
          find . -type f -size +50M -print -delete   # GitHub tillader ikke filer over 100 MB (fx webinar-video)
          git init -q -b old-media
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Medier fra det gamle site"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" old-media
